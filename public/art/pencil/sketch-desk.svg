<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Pencil-sketch animator's desk — lightbox, pencil, shavings</title>
  <defs>
    <filter id="grain-desk" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="21" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" />
    </filter>
  </defs>
  <g fill="none" stroke="#332f2b" stroke-linecap="round" filter="url(#grain-desk)">
    <!-- lightbox glow disc + grid, drawn under everything -->
    <circle cx="200" cy="190" r="120" stroke-width="1.4" opacity="0.35" />
    <circle cx="200" cy="190" r="96" stroke-width="1" opacity="0.28" />
    <g stroke-width="0.8" opacity="0.22">
      <path d="M110 190 L 290 190" />
      <path d="M200 100 L 200 280" />
      <path d="M136 128 L 264 252" />
      <path d="M264 128 L 136 252" />
    </g>
    <!-- pencil, diagonal across the disc -->
    <path d="M96 300 L 300 100" stroke-width="6" opacity="0.85" />
    <path d="M96 300 L 300 100" stroke-width="2" opacity="0.3" />
    <path d="M96 300 L 118 278" stroke-width="8" opacity="0.9" />
    <path d="M300 100 L 320 88 L 312 78" stroke-width="2.4" opacity="0.75" stroke-linejoin="round" />
    <!-- graphite tip flick marks -->
    <g stroke-width="1.2" opacity="0.55">
      <path d="M96 300 L 84 312" />
      <path d="M100 296 L 92 314" />
    </g>
    <!-- eraser, rounded rect, rough double pass -->
    <rect x="60" y="330" width="58" height="26" rx="5" stroke-width="1.8" opacity="0.75" transform="rotate(-8 89 343)" />
    <rect x="63" y="333" width="52" height="20" rx="4" stroke-width="0.8" opacity="0.4" transform="rotate(-8 89 343)" />
    <!-- shavings scatter -->
    <g stroke-width="1" opacity="0.55">
      <path d="M150 350 C 156 344, 162 350, 156 356 C 150 362, 144 356, 150 350 Z" />
      <path d="M170 360 C 176 354, 182 360, 176 366 C 170 372, 164 366, 170 360 Z" />
      <path d="M190 348 C 196 342, 202 348, 196 354 C 190 360, 184 354, 190 348 Z" />
      <path d="M132 366 C 138 360, 144 366, 138 372 C 132 378, 126 372, 132 366 Z" />
    </g>
  </g>
</svg>
