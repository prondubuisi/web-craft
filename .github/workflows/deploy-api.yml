name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'src/lib/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip without Fly token
        if: ${{ secrets.FLY_API_TOKEN == '' }}
        run: echo "Add repo secret FLY_API_TOKEN to deploy the API."
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: ${{ secrets.FLY_API_TOKEN != '' }}
      - run: flyctl deploy --remote-only
        if: ${{ secrets.FLY_API_TOKEN != '' }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
