app = "zineverse-api"
primary_region = "iad"

[build]

[env]
  PORT = "8787"
  DATABASE_PATH = "/data/zineverse.sqlite"
  NODE_ENV = "production"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

[[mounts]]
  source = "zineverse_data"
  destination = "/data"
