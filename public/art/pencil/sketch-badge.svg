<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <title>Pencil-sketch intern badge and coffee cup</title>
  <defs>
    <filter id="grain-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="52" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.2" />
    </filter>
  </defs>
  <g fill="none" stroke="#332f2b" stroke-linecap="round" filter="url(#grain-badge)">
    <!-- lanyard strap -->
    <path d="M150 20 C 130 60, 190 90, 170 130" stroke-width="10" opacity="0.5" />
    <path d="M150 20 C 130 60, 190 90, 170 130" stroke-width="2" opacity="0.3" />
    <!-- badge card, rough double outline -->
    <rect x="110" y="130" width="140" height="180" rx="10" stroke-width="2.2" opacity="0.8" transform="rotate(-4 180 220)" />
    <rect x="114" y="134" width="132" height="172" rx="8" stroke-width="0.9" opacity="0.4" transform="rotate(-4 180 220)" />
    <!-- headshot placeholder: loose oval + crossed construction lines -->
    <ellipse cx="180" cy="192" rx="34" ry="40" stroke-width="1.6" opacity="0.65" transform="rotate(-4 180 220)" />
    <path d="M150 176 L 210 176" stroke-width="0.8" opacity="0.3" transform="rotate(-4 180 220)" />
    <path d="M180 158 L 180 216" stroke-width="0.8" opacity="0.3" transform="rotate(-4 180 220)" />
    <!-- name / role scribble lines -->
    <path d="M144 254 L 216 250" stroke-width="2" opacity="0.6" transform="rotate(-4 180 220)" />
    <path d="M150 272 L 200 269" stroke-width="1.2" opacity="0.45" transform="rotate(-4 180 220)" />
    <path d="M148 288 L 208 285" stroke-width="1.2" opacity="0.45" transform="rotate(-4 180 220)" />
    <!-- coffee cup beside the badge -->
    <path d="M270 250 L 278 320 C 278 330, 320 330, 322 320 L 330 250 Z" stroke-width="1.8" opacity="0.75" />
    <path d="M270 250 L 330 250" stroke-width="1.8" opacity="0.75" />
    <path d="M330 258 C 350 258, 350 288, 328 286" stroke-width="1.6" opacity="0.65" />
    <!-- steam -->
    <path d="M288 244 C 284 228, 296 224, 292 208" stroke-width="1.2" opacity="0.5" />
    <path d="M310 244 C 306 228, 318 224, 314 208" stroke-width="1.2" opacity="0.5" />
  </g>
</svg>
